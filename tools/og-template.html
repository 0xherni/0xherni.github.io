<!DOCTYPE html>
<!--
  Plantilla de las imágenes para compartir (Open Graph, 1200×630).
  No se publica: se abre con ?p=home | demiurge | anomaly y se captura con
  Edge/Chrome headless. Ver tools/build-og.sh.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: #0a0a0b; }
  body { position: relative; font-family: 'Space Grotesk', sans-serif; color: #e4e4e7; }

  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255, 59, 59, 0.07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 59, 59, 0.07) 1px, transparent 1px);
    background-size: 48px 48px;
    -webkit-mask-image: radial-gradient(ellipse at 30% 45%, #000 15%, transparent 70%);
  }
  .glow {
    position: absolute; width: 700px; height: 700px; right: -180px; top: -40px;
    background: radial-gradient(circle, rgba(255, 59, 59, 0.16), transparent 60%);
  }

  .text { position: absolute; left: 80px; top: 0; bottom: 0; width: 640px; display: flex; flex-direction: column; justify-content: center; }
  .kicker { font-family: 'JetBrains Mono', monospace; font-size: 22px; color: #ff3b3b; margin-bottom: 28px; }
  h1 { font-weight: 700; font-size: 84px; line-height: 1.04; letter-spacing: -0.02em; color: #fafafa; }
  h1 .mute { color: #8a8a92; }
  .lead { margin-top: 28px; font-size: 26px; line-height: 1.45; color: #a1a1aa; max-width: 600px; }
  .lead b { color: #f4f4f5; font-weight: 500; }

  .foot {
    position: absolute; left: 80px; right: 80px; bottom: 48px;
    display: flex; justify-content: space-between; align-items: center;
    font-family: 'JetBrains Mono', monospace; font-size: 20px; color: #8a8a92;
  }
  .foot .brand { color: #ff3b3b; }
  .foot .brand span { color: #8a8a92; }
  .tags { display: flex; gap: 10px; }
  .tags span { border: 1px solid #222226; border-radius: 4px; padding: 6px 12px; font-size: 17px; color: #d4d4d8; }

  /* Home: foto con el mismo tratamiento que el hero */
  .photo {
    position: absolute; right: 80px; top: 75px; width: 340px; height: 425px;
    border: 1px solid #2a2a2e; border-radius: 6px; overflow: hidden;
    box-shadow: 0 0 80px rgba(255, 59, 59, 0.28);
  }
  .photo img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(0.9) contrast(1.1) brightness(1.05); display: block; }
  .photo i { position: absolute; inset: 0; background: #ff3b3b; mix-blend-mode: multiply; opacity: 0.55; }
  .photo u {
    position: absolute; inset: 0;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,0.18) 0 1px, transparent 1px 3px);
  }

  /* Proyectos: captura que sale por el borde derecho */
  .shot {
    position: absolute; left: 640px; top: 90px; width: 760px;
    border: 1px solid #2a2a2e; border-radius: 10px; overflow: hidden;
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6), 0 0 60px rgba(255, 59, 59, 0.12);
  }
  .shot img { width: 100%; display: block; }
  body.project .text { width: 520px; }
  body.project h1 { font-size: 72px; }
  body.project .lead { font-size: 24px; max-width: 500px; }
  body.project .tags { margin-top: 32px; font-family: 'JetBrains Mono', monospace; }
  /* Terminal: se muestra más grande y recortada para que se lea */
  .shot.term { top: 168px; background: #1a1a1f; }
  .shot.term img { width: 1150px; max-width: none; }
</style>
</head>
<body>
<div class="grid"></div>
<div class="glow"></div>
<div id="root"></div>

<script>
  const pages = {
    home: {
      html: `
        <div class="text">
          <p class="kicker">// Buenos Aires, Argentina</p>
          <h1><span class="mute">Hernán Argibay</span><br>Cybersecurity<br>Analyst.</h1>
        </div>
        <div class="photo"><img src="../assets/img/perfil.jpg"><i></i><u></u></div>
        <div class="foot">
          <span class="brand">0xherni<span>/</span>portfolio</span>
          <span>Threat detection · Incident response · AI for security</span>
        </div>`,
    },
    demiurge: {
      project: true,
      html: `
        <div class="text">
          <p class="kicker">// case study</p>
          <h1>Demiurge</h1>
          <p class="lead">A Windows app that answers one question: <b>is my PC clean or infected?</b></p>
          <div class="tags"><span>C# / .NET</span><span>YARA-X</span><span>Sigma</span></div>
        </div>
        <div class="shot"><img src="../assets/img/demiurge/home.webp"></div>
        <div class="foot">
          <span class="brand">0xherni<span>/</span>portfolio</span>
          <span></span>
        </div>`,
    },
    anomaly: {
      project: true,
      html: `
        <div class="text">
          <p class="kicker">// case study</p>
          <h1>Anomaly Detection API</h1>
          <p class="lead">An AI model that spots attacks in access logs and suggests <b>allow, alert or block</b>.</p>
          <div class="tags"><span>Python</span><span>FastAPI</span><span>F1 0.92</span></div>
        </div>
        <div class="shot term"><img src="../assets/img/anomaly/04_path_scan.webp"></div>
        <div class="foot">
          <span class="brand">0xherni<span>/</span>portfolio</span>
          <span></span>
        </div>`,
    },
  };
  const page = pages[new URLSearchParams(location.search).get('p')] || pages.home;
  if (page.project) document.body.classList.add('project');
  document.getElementById('root').innerHTML = page.html;
</script>
</body>
</html>
